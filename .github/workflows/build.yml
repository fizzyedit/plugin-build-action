name: Build Fizzy plugin

# Reusable workflow: build a Fizzy plugin for every target, hash each binary, assemble the
# author manifest, and publish all of them as Release assets. Runs in the *caller's* repo
# context (so `actions/checkout` pulls the plugin source).
#
# Identity (`id` / `version` / `min_sdk_version`) comes from the caller's `plugin.zig.zon`.
# `fizzy_sdk_version` + `abi_fingerprint` come from `zig-out/sdk-meta.json` (emitted by
# `fizzy.plugin.install`). All 7 targets cross-compile from ubuntu-latest — no macOS/Windows
# runners, no signing, no dlopen. Do not hand-copy sdk/fingerprint into caller YAML.
on:
  workflow_call:
    inputs:
      id:
        description: "Override plugin id (default: plugin.zig.zon .id)."
        required: false
        type: string
        default: ""
      version:
        description: "Override release version, no leading v (default: tag without v, checked against plugin.zig.zon .version)."
        required: false
        type: string
        default: ""
      zig-version:
        description: "Zig toolchain version."
        required: false
        type: string
        default: "0.16.0"
      artifact-path:
        description: "Built dylib path relative to repo root, sans extension (default zig-out/<id>)."
        required: false
        type: string
        default: ""
      targets:
        description: "Comma-separated os_arch subset to build (default: all 7). Pass the six desktop keys to skip web-wasm32. E.g. 'macos-aarch64,macos-x86_64,linux-x86_64,linux-aarch64'."
        required: false
        type: string
        default: ""
      pages-url:
        description: >-
          Base URL the plugin's web module is served from, no trailing slash — e.g.
          "https://fizzyedit.github.io/drive" (the default for this repo) or a custom domain
          like "https://drive.fizzyed.it". A browser can only fetch a plugin over CORS, and
          GitHub *release assets* send no CORS headers at all, so the `web-wasm32` download is
          published to the caller's GitHub Pages instead of attached to the release. Pages
          serves `access-control-allow-origin: *`.
        required: false
        type: string
        default: ""
    secrets:
      build_env:
        description: >-
          Environment for every `zig build` in this workflow, as KEY=VALUE lines. For a plugin
          whose build bakes in an app credential it cannot commit — `fizzyedit/drive` writes its
          `credentials.zon` from FIZZY_DRIVE_CLIENT_ID and friends. One secret rather than a
          named list, so a plugin's own variables never have to be declared in this shared
          workflow. Omit it and the build runs with nothing extra, which for drive means a
          binary that compiles and then declines to sign in.
        required: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      id: ${{ steps.meta.outputs.id }}
      version: ${{ steps.meta.outputs.version }}
      min_sdk_version: ${{ steps.meta.outputs.min_sdk_version }}
      name: ${{ steps.meta.outputs.name }}
      description: ${{ steps.meta.outputs.description }}
      tags_json: ${{ steps.meta.outputs.tags_json }}
      author: ${{ steps.meta.outputs.author }}
      author_url: ${{ steps.meta.outputs.author_url }}
      action_ref: ${{ steps.action_ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      # Scripts live in this action repo; the reusable workflow runs in the caller's
      # workspace, so it needs a second explicit checkout of this repo for them.
      #
      # This can't be resolved dynamically: `github.workflow_ref` (and `$GITHUB_WORKFLOW_REF`)
      # reflects the *caller's own* triggering workflow ref (e.g. a plugin repo's
      # `release.yml@refs/tags/v0.2.9`), not the ref this reusable `build.yml` was itself
      # pinned at via the caller's `uses: fizzyedit/plugin-build-action/.github/workflows/
      # build.yml@vN` line — there is no GitHub Actions context variable that exposes that.
      # A prior version of this step tried to extract it from `$GITHUB_WORKFLOW_REF` anyway,
      # which silently fetched the *caller's* release tag instead of this repo's own — that
      # tag never exists here, so every release failed at checkout.
      #
      # So: hardcode the major version this file's scripts are compatible with. Bump this
      # literal by hand whenever a new major tag (v4, v5, …) changes the scripts' interface.
      - name: Resolve plugin-build-action ref
        id: action_ref
        shell: bash
        run: |
          set -euo pipefail
          ref="v5"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using plugin-build-action@$ref for scripts"

      - uses: actions/checkout@v4
        with:
          repository: fizzyedit/plugin-build-action
          ref: ${{ steps.action_ref.outputs.ref }}
          path: .plugin-build-action

      - name: Read plugin.zig.zon + resolve release version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          zon=$("$py" .plugin-build-action/scripts/read_plugin_zon.py plugin.zig.zon)
          echo "$zon"

          zon_id=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          zon_version=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          zon_min=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["min_sdk_version"])')
          zon_name=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["name"])')
          zon_description=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["description"])')
          zon_tags_json=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.dumps(json.load(sys.stdin)["tags"]))')
          zon_author=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["author"])')
          zon_author_url=$(printf '%s' "$zon" | "$py" -c 'import json,sys; print(json.load(sys.stdin)["author_url"])')

          id="${{ inputs.id }}"
          [ -n "$id" ] || id="$zon_id"
          if [ "$id" != "$zon_id" ]; then
            echo "::error::inputs.id ($id) does not match plugin.zig.zon .id ($zon_id)"
            exit 1
          fi

          # Prefer an explicit input, else the triggering tag (v0.1.2 → 0.1.2).
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            ref="${GITHUB_REF_NAME:-}"
            case "$ref" in
              v*) version="${ref#v}" ;;
              *)
                echo "::error::no version input and ref '$ref' is not a v* tag; pass inputs.version or tag vX.Y.Z"
                exit 1
                ;;
            esac
          fi

          if [ "$version" != "$zon_version" ]; then
            echo "::error::release version ($version) does not match plugin.zig.zon .version ($zon_version). Bump plugin.zig.zon before tagging."
            exit 1
          fi

          {
            echo "id=$id"
            echo "version=$version"
            echo "min_sdk_version=$zon_min"
            echo "name=$zon_name"
            echo "tags_json=$zon_tags_json"
            echo "author=$zon_author"
            echo "author_url=$zon_author_url"
            echo "description<<PLUGIN_ZON_DESCRIPTION_EOF"
            echo "$zon_description"
            echo "PLUGIN_ZON_DESCRIPTION_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "OK: id=$id version=$version min_sdk_version=${zon_min:-"(default to pinned sdk)"}"

      - name: Compute build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          # All targets cross-compile from ubuntu-latest. Plugins are unsigned pure Zig +
          # vendored C (plus optional prebuilt .a/.lib deps like ghostty_vt), so there is no
          # need for macOS/Windows runners or code signing. sdk-meta.json is emitted at build
          # time — no dlopen on the runner required.
          all='[
            {"os_arch":"macos-aarch64","zig_target":"aarch64-macos","ext":"dylib"},
            {"os_arch":"macos-x86_64","zig_target":"x86_64-macos","ext":"dylib"},
            {"os_arch":"linux-x86_64","zig_target":"x86_64-linux-gnu","ext":"so"},
            {"os_arch":"linux-aarch64","zig_target":"aarch64-linux-gnu","ext":"so"},
            {"os_arch":"windows-x86_64","zig_target":"x86_64-windows","ext":"dll"},
            {"os_arch":"windows-aarch64","zig_target":"aarch64-windows","ext":"dll"},
            {"os_arch":"web-wasm32","zig_target":"wasm32-freestanding","ext":"wasm"}
          ]'
          targets="${{ inputs.targets }}"
          if [ -z "$targets" ]; then
            filtered="$all"
          else
            keep=$(printf '%s' "$targets" | jq -R -c 'split(",")')
            filtered=$(printf '%s' "$all" | jq -c --argjson keep "$keep" '[.[] | select(.os_arch as $o | $keep | index($o) != null)]')
          fi
          if [ "$(printf '%s' "$filtered" | jq 'length')" = "0" ]; then
            echo "::error::targets '$targets' matched none of the known os_arch values"; exit 1
          fi
          echo "matrix=$(printf '%s' "$filtered" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: build ${{ matrix.os_arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ubuntu-latest
    # The web build (a wasm side module the browser links at runtime) is best-effort: a plugin
    # that leans on libc, threads or processes has no browser form, and that costs it the
    # web download for this release rather than the release. The desktop targets must build.
    continue-on-error: ${{ matrix.os_arch == 'web-wasm32' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: fizzyedit/plugin-build-action
          ref: ${{ needs.setup.outputs.action_ref }}
          path: .plugin-build-action

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ inputs.zig-version }}
          cache-key: ${{ hashFiles('**/build.zig.zon') }}

      # setup-zig exports ZIG_GLOBAL_CACHE_DIR / ZIG_LOCAL_CACHE_DIR and caches that
      # directory across runs, so these steps must come AFTER it and must NOT override
      # those vars: pointing them at a workspace path leaves the action's cache empty,
      # and all six matrix jobs then re-download every dependency from
      # codeload.github.com on every release — which is where `HttpConnectionClosing`
      # comes from. (Zig 0.16 caches the downloaded tarballs under $ZIG_GLOBAL_CACHE_DIR/p
      # and unpacks them into the project-local zig-pkg/; only the tarballs are cached.)
      - name: Pre-create Zig cache tmp/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          mkdir -p "${ZIG_LOCAL_CACHE_DIR:-$GITHUB_WORKSPACE/.zig-cache}/tmp"

      # Zig 0.16's HTTP client doesn't retry on `HttpConnectionClosing` from GitHub.
      # Pre-fetch deps in a retry loop (separate from the build) so flaky Windows CI
      # fetches don't fail the whole matrix job. See fizzy .github/workflows/ci.yml.
      # Before the first `zig build` of any kind, including the fetch below: a build script that
      # generates a file from these variables typically skips the work when the file already
      # exists, so an empty one written by the fetch step would be the one that shipped.
      #
      # Through `$GITHUB_ENV` so it reaches every later step rather than just one `run:` block.
      # Values are masked in the log by Actions; nothing here echoes them.
      - name: Build environment from the `build_env` secret
        shell: bash
        env:
          BUILD_ENV: ${{ secrets.build_env }}
        run: |
          set -euo pipefail
          [ -n "${BUILD_ENV:-}" ] || { echo "no build_env secret; building with none"; exit 0; }
          n=0
          while IFS= read -r line; do
            case "$line" in
              ''|'#'*) continue ;;
              *=*)
                printf '%s\n' "$line" >> "$GITHUB_ENV"
                n=$((n+1))
                ;;
              *) echo "::warning::build_env: ignoring a line that is not KEY=VALUE" ;;
            esac
          done <<< "$BUILD_ENV"
          echo "build_env: exported $n variable(s)"

      - name: Fetch dependencies (with retries)
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local args="$1"
            local n=0
            until [ "$n" -ge 5 ]; do
              zig build --fetch $args && return 0
              n=$((n+1))
              echo "Fetch attempt $n ($args) failed, sleeping $((n*10))s before retry..."
              sleep $((n*10))
            done
            return 1
          }
          fetch "" || exit 1
          fetch "-Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}" || exit 1

      - name: Build (ReleaseFast, ${{ matrix.zig_target }})
        shell: bash
        run: |
          set -euo pipefail
          # The fetch step above is the only place with retries, but a lazy dep reached
          # only here would still be fetched by Zig's no-retry HTTP client. Retry ONLY
          # on a network-shaped failure — a real compile error must fail fast.
          log="$RUNNER_TEMP/build-${{ matrix.os_arch }}.log"
          n=0
          until [ "$n" -ge 3 ]; do
            if zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }} 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eq 'HttpConnectionClosing|invalid HTTP response|TlsInitializationFailed|ConnectionResetByPeer|TemporaryNameServerFailure|unable to fetch|connection reset' "$log"; then
              echo "Build failed for a non-network reason; not retrying."
              exit 1
            fi
            n=$((n+1))
            echo "Build attempt $n hit a network error, sleeping $((n*15))s..."
            sleep $((n*15))
          done
          echo "Build failed after $n network retries"; exit 1

      - name: Stage binary + sha256 fragment
        shell: bash
        run: |
          set -euo pipefail
          id="${{ needs.setup.outputs.id }}"
          version="${{ needs.setup.outputs.version }}"
          base="${{ inputs.artifact-path }}"
          [ -n "$base" ] || base="zig-out/${id}"
          src="${base}.${{ matrix.ext }}"
          asset="${id}-${{ matrix.os_arch }}.${{ matrix.ext }}"
          test -f "$src" || { echo "::error::built artifact not found at $src"; exit 1; }

          mkdir -p out frag
          cp "$src" "out/${asset}"

          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$src" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$src" | awk '{print $1}')
          fi

          # Where a browser will fetch this from. Only the web module differs: release assets
          # carry no `access-control-allow-origin`, so a `fetch()` for one fails before it
          # starts — the download has to come from Pages (published in the release job below).
          # Versioned in the path so an older fizzy keeps resolving the build it was matched
          # with, the same promise the release assets make.
          if [ "${{ matrix.os_arch }}" = "web-wasm32" ]; then
            pages="${{ inputs.pages-url }}"
            [ -n "$pages" ] || pages="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            url="${pages}/web/v${version}/${asset}"
          else
            url="https://github.com/${{ github.repository }}/releases/download/v${version}/${asset}"
          fi
          printf '{"os_arch":"%s","url":"%s","sha256":"%s"}\n' \
            "${{ matrix.os_arch }}" "$url" "$sum" > "frag/${{ matrix.os_arch }}.json"
          cat "frag/${{ matrix.os_arch }}.json"

      # sdk-meta.json is emitted by fizzy.plugin.install at build time (same pin + optimize
      # class as the dylib). Available for every cross target — no dlopen on the runner.
      - name: Collect SDK metadata
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          id="${{ needs.setup.outputs.id }}"
          test -f zig-out/sdk-meta.json || {
            echo "::error::zig-out/sdk-meta.json missing — rebuild against a fizzy pin that emits it from fizzy.plugin.install"
            exit 1
          }
          mkdir -p sdk-meta
          cp zig-out/sdk-meta.json "sdk-meta/${{ matrix.os_arch }}.json"
          cat "sdk-meta/${{ matrix.os_arch }}.json"

          got_id=$("$py" -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "sdk-meta/${{ matrix.os_arch }}.json")
          got_ver=$("$py" -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "sdk-meta/${{ matrix.os_arch }}.json")
          if [ "$got_id" != "$id" ]; then
            echo "::error::sdk-meta id ($got_id) != plugin.zig.zon id ($id)"; exit 1
          fi
          if [ "$got_ver" != "${{ needs.setup.outputs.version }}" ]; then
            echo "::error::sdk-meta version ($got_ver) != release version (${{ needs.setup.outputs.version }})"; exit 1
          fi

          zon_min="${{ needs.setup.outputs.min_sdk_version }}"
          if [ -n "$zon_min" ]; then
            got_min=$("$py" -c 'import json,sys; print(json.load(open(sys.argv[1]))["min_sdk_version"])' "sdk-meta/${{ matrix.os_arch }}.json")
            if [ "$got_min" != "$zon_min" ]; then
              echo "::error::sdk-meta min_sdk_version ($got_min) != plugin.zig.zon ($zon_min)"; exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_arch }}
          path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: frag-${{ matrix.os_arch }}
          path: frag/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-meta-${{ matrix.os_arch }}
          path: sdk-meta/*

  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: fizzyedit/plugin-build-action
          ref: ${{ needs.setup.outputs.action_ref }}
          path: .plugin-build-action

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: frag-*
          path: frags
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-meta-*
          path: sdk-metas
          merge-multiple: true

      - name: Consensus SDK metadata
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          shopt -s nullglob
          files=(sdk-metas/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no sdk-meta artifacts from any target"
            exit 1
          fi
          "$py" - "${files[@]}" <<'PY'
          import json, sys
          metas = [json.loads(open(p).read()) for p in sys.argv[1:]]
          fps = {m["abi_fingerprint"] for m in metas}
          sdks = {m["fizzy_sdk_version"] for m in metas}
          mins = {m["min_sdk_version"] for m in metas}
          if len(fps) != 1:
              print(f"::error::targets disagree on abi_fingerprint: {sorted(fps)}")
              sys.exit(1)
          if len(sdks) != 1:
              print(f"::error::targets disagree on fizzy_sdk_version: {sorted(sdks)}")
              sys.exit(1)
          if len(mins) != 1:
              print(f"::error::targets disagree on min_sdk_version: {sorted(mins)}")
              sys.exit(1)
          m = metas[0]
          print(f"OK: consensus from {len(metas)} cross-target(s): "
                f"fizzy_sdk_version={m['fizzy_sdk_version']} "
                f"abi_fingerprint={m['abi_fingerprint']} "
                f"min_sdk_version={m['min_sdk_version']}")
          with open("sdk-consensus.json", "w") as f:
              json.dump(m, f, indent=2)
              f.write("\n")
          PY
          {
            echo "abi_fingerprint=$("$py" -c 'import json; print(json.load(open("sdk-consensus.json"))["abi_fingerprint"])')"
            echo "fizzy_sdk_version=$("$py" -c 'import json; print(json.load(open("sdk-consensus.json"))["fizzy_sdk_version"])')"
            echo "min_sdk_version=$("$py" -c 'import json; print(json.load(open("sdk-consensus.json"))["min_sdk_version"])')"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble manifest.json
        env:
          # Routed through env vars rather than direct ${{ }} interpolation into the script body:
          # these three come from the caller's own plugin.zig.zon (name/tags free-form, could
          # contain shell metacharacters like a stray quote) — expanding them straight into the
          # `run:` script text would be a classic Actions script-injection hole.
          PLUGIN_NAME: ${{ needs.setup.outputs.name }}
          PLUGIN_DESCRIPTION: ${{ needs.setup.outputs.description }}
          PLUGIN_TAGS_JSON: ${{ needs.setup.outputs.tags_json }}
          PLUGIN_AUTHOR: ${{ needs.setup.outputs.author }}
          PLUGIN_AUTHOR_URL: ${{ needs.setup.outputs.author_url }}
        run: |
          python3 .plugin-build-action/scripts/assemble_manifest.py \
            --id "${{ needs.setup.outputs.id }}" \
            --version "${{ needs.setup.outputs.version }}" \
            --abi-fingerprint "${{ steps.sdk.outputs.abi_fingerprint }}" \
            --fizzy-sdk-version "${{ steps.sdk.outputs.fizzy_sdk_version }}" \
            --min-sdk-version "${{ steps.sdk.outputs.min_sdk_version }}" \
            --name "$PLUGIN_NAME" \
            --description "$PLUGIN_DESCRIPTION" \
            --tags-json "$PLUGIN_TAGS_JSON" \
            --author "$PLUGIN_AUTHOR" \
            --author-url "$PLUGIN_AUTHOR_URL" \
            --merge-url "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            --frags frags \
            --out dist/manifest.json
          echo "----- manifest.json -----"; cat dist/manifest.json

      # A manifest entry is a promise that an asset of that name will be on the release. The
      # web target broke that promise silently once: its job built and staged a fragment, the
      # upload globs below listed dylib/so/dll and not wasm, and the published manifest pointed
      # at a `…-web-wasm32.wasm` that 404s — an install that fails with nothing to see. Check
      # the promise here rather than discovering it from a user.
      - name: Every advertised download exists in dist/
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r name; do
            if [ ! -f "dist/$name" ]; then
              echo "::error::manifest advertises $name but it is not in dist/ — it will 404"
              missing=1
            fi
          done < <(python3 -c '
          import json, sys
          m = json.load(open("dist/manifest.json"))
          for rel in m.get("releases", []):
              if rel.get("version") != sys.argv[1]:
                  continue
              for d in rel.get("downloads", {}).values():
                  print(d["url"].rsplit("/", 1)[-1])
          ' "${{ needs.setup.outputs.version }}")
          # Every file is checked against `dist/` whether it ends up on the release or on Pages:
          # both are published from there, and the promise the manifest makes is the same one.
          [ "$missing" -eq 0 ] || exit 1
          echo "every advertised download is present"

      # The web module goes to Pages rather than onto the release, because that is the only one
      # of the two a browser can fetch: release assets send no `access-control-allow-origin`, so
      # `fetch()` fails before a byte moves. Pages sends `*`.
      #
      # Written to an orphan `gh-pages` branch in the *caller's* repo, under `web/v<version>/`,
      # and older versions are left alone — a fizzy pinned to an older SDK keeps resolving the
      # build it was matched with. `.nojekyll` stops Pages from filtering the directory.
      - name: Publish the web module to Pages
        if: hashFiles('dist/*.wasm') != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.setup.outputs.version }}"
          work="$RUNNER_TEMP/pages"
          repo="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git clone --depth 1 --branch gh-pages "$repo" "$work" 2>/dev/null; then
            echo "gh-pages exists"
          else
            echo "creating gh-pages"
            rm -rf "$work"   # a failed --branch clone can leave a partial directory behind
            git clone --depth 1 "$repo" "$work"
            git -C "$work" checkout --orphan gh-pages
            git -C "$work" rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p "$work/web/v${version}"
          cp dist/*.wasm "$work/web/v${version}/"
          touch "$work/.nojekyll"

          git -C "$work" add -A
          if git -C "$work" diff --cached --quiet; then
            echo "nothing changed on gh-pages"
            exit 0
          fi
          git -C "$work" commit -m "web module for v${version}"
          git -C "$work" push origin gh-pages
          echo "published: $(ls dist/*.wasm | xargs -n1 basename | tr '\n' ' ')"

      # Pages has to be serving that branch for the URL in the manifest to resolve. It is a
      # repo setting, not something a workflow can turn on, so say so once rather than leaving
      # a 404 to be discovered by a user mid-install.
      - name: Remind about Pages
        if: hashFiles('dist/*.wasm') != ''
        shell: bash
        run: |
          echo "::notice::A web module was published to gh-pages. If this is the first release" \
               "with one, enable Pages for this repo: Settings › Pages › Source: Deploy from a" \
               "branch › gh-pages / (root). Until then the web-wasm32 download 404s."

      - name: Publish release (binaries + manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.setup.outputs.version }}
          files: |
            dist/*.dylib
            dist/*.so
            dist/*.dll
            dist/manifest.json
