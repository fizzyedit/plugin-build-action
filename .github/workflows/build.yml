name: Build Fizzy plugin

# Reusable workflow: build a Fizzy plugin for every target, hash each binary, assemble the
# author manifest, and publish all of them as Release assets. Runs in the *caller's* repo
# context (so `actions/checkout` pulls the plugin source).
on:
  workflow_call:
    inputs:
      id:
        description: "Plugin id (must equal manifest id and the registry/<id>.json stem)."
        required: true
        type: string
      version:
        description: "Plugin release version, no leading v (e.g. 0.1.0)."
        required: true
        type: string
      fizzy-sdk-version:
        description: "Fizzy SDK version this build targets (e.g. 0.9.0) — your pinned commit's sdk_version."
        required: true
        type: string
      abi-fingerprint:
        description: "Host runtime ABI fingerprint hex, ReleaseFast (e.g. 0x17428bfc3819460c) — must match your pinned commit."
        required: true
        type: string
      min-sdk-version:
        description: "Minimum Fizzy SDK version required to load (defaults to fizzy-sdk-version)."
        required: false
        type: string
        default: ""
      zig-version:
        description: "Zig toolchain version."
        required: false
        type: string
        default: "0.16.0"
      artifact-path:
        description: "Built dylib path relative to repo root, sans extension (default zig-out/<id>)."
        required: false
        type: string
        default: ""
      targets:
        description: "Comma-separated os_arch subset to build (default: all 6). E.g. 'macos-aarch64,macos-x86_64,linux-x86_64,linux-aarch64'."
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/zig-global-cache

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # Catches the exact class of bug a plugin author bumping `build.zig.zon`'s version
      # without also bumping it before tagging (or vice versa) produces: the tag drives the
      # release/manifest version, `build.zig.zon` drives what the plugin itself reports, and
      # nothing else here cross-checks them. Fails fast, before any of the 6 build legs run.
      - name: Verify build.zig.zon version matches release tag
        shell: bash
        run: |
          set -euo pipefail
          zon_version=$(grep -v '^\s*//' build.zig.zon | grep -oE '\.version[[:space:]]*=[[:space:]]*"[^"]+"' | head -n1 | grep -oE '"[^"]+"' | tr -d '"')
          if [ -z "$zon_version" ]; then
            echo "::error::could not find .version in build.zig.zon"; exit 1
          fi
          if [ "$zon_version" != "${{ inputs.version }}" ]; then
            echo "::error::build.zig.zon .version ($zon_version) does not match the release tag version (${{ inputs.version }}). Bump build.zig.zon before tagging a release."
            exit 1
          fi
          echo "OK: build.zig.zon version $zon_version matches tag v${{ inputs.version }}"

      # A Fizzy plugin is a native dylib/.so/.dll, so every host target Fizzy supports needs
      # its own build by default. Plugins are pure Zig + vendored C (stbi/msf_gif/zip compile
      # from source), so the non-native arches cross-compile from the same runners via
      # `-Dtarget=` — no scarce arm64 runners required. `os_arch` flows into the asset name
      # + manifest.json and MUST match what the host loader expects for each target; do not
      # rename these. `native: true` marks the targets whose dylib can actually be *loaded*
      # on their runner (target arch == runner arch), so the fingerprint-verify step can
      # dlopen the built binary and read its exported `fizzy_plugin_abi_fingerprint`.
      # Cross-compiled targets can't be loaded on the runner, so they skip that check.
      # `targets` (optional) filters this list down to a subset, e.g. for a plugin that only
      # supports macOS/Linux so far — `scripts/assemble_manifest.py` already tolerates a
      # manifest built from a partial set of platform fragments.
      - name: Compute build matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          all='[
            {"os_arch":"macos-aarch64","runner":"macos-14","zig_target":"aarch64-macos","ext":"dylib","native":true},
            {"os_arch":"macos-x86_64","runner":"macos-14","zig_target":"x86_64-macos","ext":"dylib"},
            {"os_arch":"linux-x86_64","runner":"ubuntu-latest","zig_target":"x86_64-linux-gnu","ext":"so","native":true},
            {"os_arch":"linux-aarch64","runner":"ubuntu-latest","zig_target":"aarch64-linux-gnu","ext":"so"},
            {"os_arch":"windows-x86_64","runner":"windows-latest","zig_target":"x86_64-windows","ext":"dll","native":true},
            {"os_arch":"windows-aarch64","runner":"windows-latest","zig_target":"aarch64-windows","ext":"dll"}
          ]'
          targets="${{ inputs.targets }}"
          if [ -z "$targets" ]; then
            filtered="$all"
          else
            keep=$(printf '%s' "$targets" | jq -R -c 'split(",")')
            filtered=$(printf '%s' "$all" | jq -c --argjson keep "$keep" '[.[] | select(.os_arch as $o | $keep | index($o) != null)]')
          fi
          if [ "$(printf '%s' "$filtered" | jq 'length')" = "0" ]; then
            echo "::error::targets '$targets' matched none of the known os_arch values"; exit 1
          fi
          echo "matrix=$(printf '%s' "$filtered" | jq -c .)" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    name: build ${{ matrix.os_arch }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Pre-create Zig cache tmp/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ZIG_GLOBAL_CACHE_DIR/tmp"
          mkdir -p "${ZIG_LOCAL_CACHE_DIR:-$GITHUB_WORKSPACE/.zig-cache}/tmp"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ inputs.zig-version }}

      # Zig 0.16's HTTP client doesn't retry on `HttpConnectionClosing` from GitHub.
      # Pre-fetch deps in a retry loop (separate from the build) so flaky Windows CI
      # fetches don't fail the whole matrix job. See fizzy .github/workflows/ci.yml.
      - name: Fetch dependencies (with retries)
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local args="$1"
            local n=0
            until [ "$n" -ge 5 ]; do
              zig build --fetch $args && return 0
              n=$((n+1))
              echo "Fetch attempt $n ($args) failed, sleeping $((n*10))s before retry..."
              sleep $((n*10))
            done
            return 1
          }
          fetch "" || exit 1
          fetch "-Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}" || exit 1

      - name: Build (ReleaseFast, ${{ matrix.zig_target }})
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Stage binary + sha256 fragment
        shell: bash
        run: |
          set -euo pipefail
          base="${{ inputs.artifact-path }}"
          [ -n "$base" ] || base="zig-out/${{ inputs.id }}"
          src="${base}.${{ matrix.ext }}"
          asset="${{ inputs.id }}-${{ matrix.os_arch }}.${{ matrix.ext }}"
          test -f "$src" || { echo "::error::built artifact not found at $src"; exit 1; }

          mkdir -p out frag
          cp "$src" "out/${asset}"

          # sha256, portable across runners.
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$src" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$src" | awk '{print $1}')
          fi

          url="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/${asset}"
          printf '{"os_arch":"%s","url":"%s","sha256":"%s"}\n' \
            "${{ matrix.os_arch }}" "$url" "$sum" > "frag/${{ matrix.os_arch }}.json"
          cat "frag/${{ matrix.os_arch }}.json"

      # Guard against the fingerprint/mode footgun: the manifest records `abi-fingerprint`
      # (passed by the caller) as the hard load key, but the actual value depends on the build
      # mode. dlopen the just-built binary, read its exported `fizzy_plugin_abi_fingerprint`,
      # and fail loudly if it disagrees with what will be published. Only the native targets
      # (target arch == runner arch) can be loaded on the runner; cross builds skip this.
      - name: Verify ABI fingerprint matches input
        if: ${{ matrix.native }}
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          asset="out/${{ inputs.id }}-${{ matrix.os_arch }}.${{ matrix.ext }}"
          "$py" - "$asset" "${{ inputs.abi-fingerprint }}" <<'PY'
          import ctypes, sys
          path, expected = sys.argv[1], sys.argv[2]
          loader = ctypes.WinDLL if sys.platform.startswith("win") else ctypes.CDLL
          lib = loader(path)
          fn = lib.fizzy_plugin_abi_fingerprint
          fn.restype = ctypes.c_uint64
          actual = fn()
          exp = int(expected, 16)
          if actual != exp:
              print(f"::error::{path} exports abi_fingerprint 0x{actual:016x}, but the "
                    f"abi-fingerprint input is {expected} (0x{exp:016x}). This build is "
                    f"ReleaseFast — set the caller's abi-fingerprint to the host's ReleaseFast "
                    f"abi_fingerprint (the value shipped fizzy computes).")
              sys.exit(1)
          print(f"OK: abi_fingerprint 0x{actual:016x} matches the abi-fingerprint input")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_arch }}
          path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: frag-${{ matrix.os_arch }}
          path: frag/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A reusable workflow runs in the caller's context, so this action repo's own scripts/
      # aren't on disk — check them out explicitly. Pin to a tag in production.
      - uses: actions/checkout@v4
        with:
          repository: fizzyedit/plugin-build-action
          ref: v2
          path: .plugin-build-action

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: frag-*
          path: frags
          merge-multiple: true

      - name: Assemble manifest.json
        run: |
          python3 .plugin-build-action/scripts/assemble_manifest.py \
            --id "${{ inputs.id }}" \
            --version "${{ inputs.version }}" \
            --abi-fingerprint "${{ inputs.abi-fingerprint }}" \
            --fizzy-sdk-version "${{ inputs.fizzy-sdk-version }}" \
            --min-sdk-version "${{ inputs.min-sdk-version || inputs.fizzy-sdk-version }}" \
            --merge-url "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            --frags frags \
            --out dist/manifest.json
          echo "----- manifest.json -----"; cat dist/manifest.json

      - name: Publish release (binaries + manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            dist/*.dylib
            dist/*.so
            dist/*.dll
            dist/manifest.json
