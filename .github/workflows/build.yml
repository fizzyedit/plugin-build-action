name: Build Fizzy plugin

# Reusable workflow: build a Fizzy plugin for every target, hash each binary, assemble the
# author manifest, and publish all of them as Release assets. Runs in the *caller's* repo
# context (so `actions/checkout` pulls the plugin source).
on:
  workflow_call:
    inputs:
      id:
        description: "Plugin id (must equal manifest id and the registry/<id>.json stem)."
        required: true
        type: string
      version:
        description: "Plugin release version, no leading v (e.g. 0.1.0)."
        required: true
        type: string
      fizzy-sdk-version:
        description: "Fizzy SDK version this build targets (e.g. 0.7.0)."
        required: true
        type: string
      abi-fingerprint:
        description: "Host ABI fingerprint hex (e.g. 0x1bb54eb7506cbd78) — must match the SDK."
        required: true
        type: string
      min-sdk-version:
        description: "Minimum Fizzy SDK version required to load (defaults to fizzy-sdk-version)."
        required: false
        type: string
        default: ""
      zig-version:
        description: "Zig toolchain version."
        required: false
        type: string
        default: "0.16.0"
      artifact-path:
        description: "Built dylib path relative to repo root, sans extension (default zig-out/<id>)."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.os_arch }}
    strategy:
      fail-fast: false
      matrix:
        # A Fizzy plugin is a native dylib/.so/.dll, so every host target Fizzy supports needs
        # its own build. Plugins are pure Zig + vendored C (stbi/msf_gif/zip compile from source),
        # so the non-native arches cross-compile from the same runners via `-Dtarget=` — no
        # scarce arm64 runners required. `os_arch` flows into the asset name + manifest.json and
        # MUST match what the host loader expects for each target; do not rename these.
        # `native: true` marks the targets whose dylib can actually be *loaded* on their runner
        # (target arch == runner arch), so the fingerprint-verify step can dlopen the built binary
        # and read its exported `fizzy_plugin_abi_fingerprint`. Cross-compiled targets can't be
        # loaded on the runner, so they skip that check.
        include:
          - os_arch: macos-aarch64
            runner: macos-14
            zig_target: aarch64-macos
            ext: dylib
            native: true
          - os_arch: macos-x86_64
            runner: macos-14
            zig_target: x86_64-macos
            ext: dylib
          - os_arch: linux-x86_64
            runner: ubuntu-latest
            zig_target: x86_64-linux-gnu
            ext: so
            native: true
          - os_arch: linux-aarch64
            runner: ubuntu-latest
            zig_target: aarch64-linux-gnu
            ext: so
          - os_arch: windows-x86_64
            runner: windows-latest
            zig_target: x86_64-windows
            ext: dll
            native: true
          - os_arch: windows-aarch64
            runner: windows-latest
            zig_target: aarch64-windows
            ext: dll
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ inputs.zig-version }}

      - name: Build (ReleaseFast, ${{ matrix.zig_target }})
        shell: bash
        run: |
          set -euo pipefail
          # Workaround for Zig 0.16.0 zip-fetch bug (ziglang/zig#31964 / #35264):
          # the .zip unpack path creates its temp file under <global-cache>/tmp
          # without first ensuring that directory exists, so a cold CI cache fails
          # with "failed to create temporary zip file: FileNotFound". Pre-create it.
          # NOTE: once the fizzy velopack-split lands and the plugin's fizzy pin is
          # bumped past it, plugin builds no longer fetch velopack's .zip dep and this
          # can be removed. Keep it until then.
          mkdir -p "${ZIG_GLOBAL_CACHE_DIR:-$HOME/.cache/zig}/tmp"
          # ReleaseFast to match the SHIPPED host: fizzy's release CI packages with
          # `-Doptimize=ReleaseFast` (fizzy .github/workflows/release.yml), and the host's
          # `abi_fingerprint` folds in optimize mode. A plugin must be built in the same mode
          # as the host that loads it or the loader rejects it with AbiMismatch. (A developer's
          # `zig build run` Debug editor is a different layout class and won't load these — for
          # local dev, run a ReleaseFast editor or build the plugin with `zig build install`.)
          zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig_target }}

      - name: Stage binary + sha256 fragment
        shell: bash
        run: |
          set -euo pipefail
          base="${{ inputs.artifact-path }}"
          [ -n "$base" ] || base="zig-out/${{ inputs.id }}"
          src="${base}.${{ matrix.ext }}"
          asset="${{ inputs.id }}-${{ matrix.os_arch }}.${{ matrix.ext }}"
          test -f "$src" || { echo "::error::built artifact not found at $src"; exit 1; }

          mkdir -p out frag
          cp "$src" "out/${asset}"

          # sha256, portable across runners.
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "$src" | awk '{print $1}')
          else
            sum=$(shasum -a 256 "$src" | awk '{print $1}')
          fi

          url="https://github.com/${{ github.repository }}/releases/download/v${{ inputs.version }}/${asset}"
          printf '{"os_arch":"%s","url":"%s","sha256":"%s"}\n' \
            "${{ matrix.os_arch }}" "$url" "$sum" > "frag/${{ matrix.os_arch }}.json"
          cat "frag/${{ matrix.os_arch }}.json"

      # Guard against the fingerprint/mode footgun: the manifest records `abi-fingerprint`
      # (passed by the caller) as the hard load key, but the actual value depends on the build
      # mode. dlopen the just-built binary, read its exported `fizzy_plugin_abi_fingerprint`,
      # and fail loudly if it disagrees with what will be published. Only the native targets
      # (target arch == runner arch) can be loaded on the runner; cross builds skip this.
      - name: Verify ABI fingerprint matches input
        if: ${{ matrix.native }}
        shell: bash
        run: |
          set -euo pipefail
          py=$(command -v python3 || command -v python)
          asset="out/${{ inputs.id }}-${{ matrix.os_arch }}.${{ matrix.ext }}"
          "$py" - "$asset" "${{ inputs.abi-fingerprint }}" <<'PY'
          import ctypes, sys
          path, expected = sys.argv[1], sys.argv[2]
          loader = ctypes.WinDLL if sys.platform.startswith("win") else ctypes.CDLL
          lib = loader(path)
          fn = lib.fizzy_plugin_abi_fingerprint
          fn.restype = ctypes.c_uint64
          actual = fn()
          exp = int(expected, 16)
          if actual != exp:
              print(f"::error::{path} exports abi_fingerprint 0x{actual:016x}, but the "
                    f"abi-fingerprint input is {expected} (0x{exp:016x}). This build is "
                    f"ReleaseFast — set the caller's abi-fingerprint to the host's ReleaseFast "
                    f"abi_fingerprint (the value shipped fizzy computes).")
              sys.exit(1)
          print(f"OK: abi_fingerprint 0x{actual:016x} matches the abi-fingerprint input")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os_arch }}
          path: out/*
      - uses: actions/upload-artifact@v4
        with:
          name: frag-${{ matrix.os_arch }}
          path: frag/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # A reusable workflow runs in the caller's context, so this action repo's own scripts/
      # aren't on disk — check them out explicitly. Pin to a tag in production.
      - uses: actions/checkout@v4
        with:
          repository: fizzyedit/plugin-build-action
          path: .plugin-build-action

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: frag-*
          path: frags
          merge-multiple: true

      - name: Assemble manifest.json
        run: |
          python3 .plugin-build-action/scripts/assemble_manifest.py \
            --id "${{ inputs.id }}" \
            --version "${{ inputs.version }}" \
            --abi-fingerprint "${{ inputs.abi-fingerprint }}" \
            --fizzy-sdk-version "${{ inputs.fizzy-sdk-version }}" \
            --min-sdk-version "${{ inputs.min-sdk-version || inputs.fizzy-sdk-version }}" \
            --merge-url "https://github.com/${{ github.repository }}/releases/latest/download/manifest.json" \
            --frags frags \
            --out dist/manifest.json
          echo "----- manifest.json -----"; cat dist/manifest.json

      - name: Publish release (binaries + manifest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            dist/*.dylib
            dist/*.so
            dist/*.dll
            dist/manifest.json
