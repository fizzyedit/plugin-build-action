# Drop this into a plugin repo as .github/workflows/release.yml.
# Tagging `vX.Y.Z` builds every target, hashes them, assembles manifest.json, and publishes
# all of it as assets on the vX.Y.Z release.
#
# Identity SoT is the repo's plugin.zig.zon (id / version / min_sdk_version). The pushed tag
# MUST equal plugin.zig.zon's .version. The action reads that file — you do not pass id /
# version / sdk / fingerprint as workflow inputs.
#
# fizzy_sdk_version + abi_fingerprint are derived from the built ReleaseFast dylib (they are
# whatever your pinned fizzy commit embeds). Do not copy them into this file.
#
# Prerequisite: your build.zig.zon must pin the Fizzy SDK release asset by URL+hash
# (not a local `path`, and not the git archive of an sdk-v* tag — that is the monorepo):
#
#     .fizzy = .{
#         .url = "https://github.com/fizzyedit/fizzy/releases/download/sdk-v0.1.42/fizzy-sdk-v0.1.42.tar.gz",
#         .hash = "<zig-package-hash>",
#     },
#
# Your registry/<id>.json `manifest_url` then points at
# https://github.com/<owner>/<repo>/releases/latest/download/manifest.json.
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    uses: fizzyedit/plugin-build-action/.github/workflows/build.yml@v3
    permissions:
      contents: write
    with:
      zig-version: "0.16.0"
